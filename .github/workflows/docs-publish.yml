name: Docs Publish

# This repo owns the book, not the site. https://kaas.rs/ is served from
# kaas-rs/kaas-landing-page, which holds the landing page and mounts the
# book under /book/. So this workflow builds the book and hands the render
# over on the `book-dist` branch, then pokes the landing repo to redeploy.
#
# The book's *source* — docs/src, the mdbook pins below, and the
# `cargo xtask check-docs-drift` gates in ci.yml — stays here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # force-pushes the render to book-dist

# One publish at a time; a superseded push just skips to the newest.
concurrency:
  group: book-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: arc-runner-set
    env:
      # Keep in lockstep with the `docs` job in ci.yml — same pins,
      # same 0.4.x-line caveat (mdbook-mermaid >= 0.17 targets mdbook
      # 0.5; bump all three together).
      MDBOOK_VERSION: v0.4.52
      MDBOOK_MERMAID_VERSION: v0.16.2
      MDBOOK_LINKCHECK_VERSION: v0.7.7
      LANDING_REPO: kaas-rs/kaas-landing-page
      LANDING_DISPATCH_TOKEN: ${{ secrets.LANDING_DISPATCH_TOKEN }}
    steps:
      - name: Install curl + unzip (minimal runner image)
        run: |
          if command -v apt-get >/dev/null; then
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends \
              curl ca-certificates unzip
          fi

      - uses: actions/checkout@v6

      - name: Install mdbook + mdbook-mermaid + mdbook-linkcheck (pinned)
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSL -o /tmp/mdbook-linkcheck.zip \
            "https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/${MDBOOK_LINKCHECK_VERSION}/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip"
          unzip -o -d "$HOME/.local/bin" /tmp/mdbook-linkcheck.zip mdbook-linkcheck
          chmod +x "$HOME/.local/bin/mdbook-linkcheck"

      - name: mdbook build
        run: mdbook build docs

      # book-dist carries only the render, one orphan commit deep — it is a
      # build artifact, so it is force-pushed rather than accumulated.
      - name: Publish the render to book-dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f docs/book/html/index.html
          cd docs/book/html
          git init -q
          git checkout -q -b book-dist
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "book: render of ${GITHUB_SHA}"
          git push -q -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" book-dist

      # The default GITHUB_TOKEN cannot dispatch to another repo, so this
      # needs a PAT. Absent it, the book still lands on book-dist and the
      # site picks it up on the landing repo's next build — a stale site,
      # not a red one. See that repo's README for the token setup.
      # curl, not `gh` — the ARC runner image is bare and has no gh CLI
      # (same reason the first step installs curl itself).
      - name: Trigger the site rebuild
        if: env.LANDING_DISPATCH_TOKEN != ''
        env:
          DISPATCH_TOKEN: ${{ secrets.LANDING_DISPATCH_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${LANDING_REPO}/dispatches" \
            -d "{\"event_type\":\"book-updated\",\"client_payload\":{\"sha\":\"${GITHUB_SHA}\"}}")
          if [ "$code" != "204" ]; then
            echo "dispatch to ${LANDING_REPO} failed (HTTP ${code}):"
            cat /tmp/dispatch.out
            exit 1
          fi
          echo "dispatched book-updated to ${LANDING_REPO}"

      - name: Note a skipped dispatch
        if: env.LANDING_DISPATCH_TOKEN == ''
        run: |
          echo "::warning::LANDING_DISPATCH_TOKEN unset — book-dist updated, but ${LANDING_REPO} was not told to redeploy."
